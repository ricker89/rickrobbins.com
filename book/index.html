<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Call — Rick Robbins</title>
  <meta name="description" content="Book a free call with Rick Robbins. No pitch, no pressure.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Lato', system-ui, sans-serif;
      background: #FAFAF9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 24px;
      background: #0F172A;
      width: 100%;
    }
    .logo-bar img {
      width: 288px;
      max-width: 52vw;
      height: auto;
    }
    .calendar-wrap {
      width: 100%;
      max-width: 700px;
      margin: 40px auto 0;
      padding: 0 16px 40px;
    }
    .calendar-frame {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 4px 40px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .calendar-frame iframe {
      display: block;
    }
    .copyright {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #94A3B8;
      font-weight: 300;
    }
  </style>
</head>
<body>
  <div class="logo-bar">
    <a href="https://rickrobbins.com"><img src="/rick-robbins-logo-light.svg" alt="Rick Robbins"></a>
  </div>

  <div class="calendar-wrap">
    <div class="calendar-frame">
      <iframe
        src="https://api.leadconnectorhq.com/widget/booking/U32q3st8mzr8ehgPfaZ1?primary_color=%230F172A"
        allow="payment"
        style="width:100%;border:none;overflow:hidden;min-height:640px;"
        scrolling="no"
        title="Book a call with Rick Robbins"
      ></iframe>
    </div>
  </div>

  <div class="copyright">
    <p>&copy; 2026 Rick Robbins</p>
  </div>

  <script src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>
</body>
</html>
